<text x="10" y="48">last page</text>
<text x="186" y="48" text-anchor="end">0120h</text>
<text x="290" y="48" text-anchor="end">0020h</text>
<text x="10" y="78">pages</text>
<text x="186" y="78" text-anchor="end">0007h</text>
<text x="290" y="78" text-anchor="end">0003h</text>
<text x="10" y="108">SS</text>
