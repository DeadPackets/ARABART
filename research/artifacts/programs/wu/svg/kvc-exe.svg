<text x="290" y="198" text-anchor="end">0000h</text>
<text x="10" y="228">size</text>
<text x="186" y="228" text-anchor="end">3,360</text>
<text x="290" y="228" text-anchor="end">1,056</text>
<text class="t-cy" x="10" y="270">SP = C0C1h: Koko's mark.</text>
