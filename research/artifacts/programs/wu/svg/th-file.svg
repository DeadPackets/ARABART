<svg class="dg" viewBox="0 0 640 156" role="img" aria-labelledby="th-file-t">
<title id="th-file-t">TAHER.COM to scale: a 19-byte decoder, the 152-byte player, the 65-byte hidden credit, and a 2,109-byte script. The first 241 bytes match ARABIC/DEMO.COM.</title>
<path class="wire-hi" d="M20 30 V22 H81.6 V30" />
<text class="t-yl" x="20" y="16">same 241 bytes as ARABIC/DEMO.COM</text>
<rect class="box-ink" x="20" y="36" width="4.85934" height="40" />
<rect class="box-hi" x="24.8593" y="36" width="38.8747" height="40" />
<rect class="box-dash" x="63.734" y="36" width="16.624" height="40" />
<rect class="box" x="80.3581" y="36" width="539.386" height="40" />
<rect class="box-bk" x="619.744" y="36" width="0.255754" height="40" />
<text x="350.179" y="62" text-anchor="middle">script: 2,109 bytes, 901 strokes</text>
<rect class="box-ink" x="20" y="98" width="18" height="18" />
<text x="48" y="112">decoder 19 B</text>
<rect class="box-hi" x="226" y="98" width="18" height="18" />
<text x="254" y="112">player 152 B</text>
<rect class="box-dash" x="432" y="98" width="18" height="18" />
<text x="460" y="112">hidden credit 65 B</text>
<text class="t-cy" x="20" y="144">The last byte is 1Ah, the DOS end-of-file mark.</text>
</svg>
<svg slot="narrow" class="dg" viewBox="0 0 300 210" role="img" aria-labelledby="th-file-tn">
<title id="th-file-tn">TAHER.COM parts and their sizes in bytes.</title>
<text class="t-cy" x="10" y="18">TAHER.COM, 2,346 bytes</text>
<rect class="box-ink" x="10" y="30" width="4" height="22" />
<text x="98" y="47">decoder 19</text>
<rect class="box-hi" x="10" y="62" width="5.76577" height="22" />
<text x="98" y="79">player 152</text>
<rect class="box-dash" x="10" y="94" width="4" height="22" />
<text x="98" y="111">credit 65</text>
<rect class="box" x="10" y="126" width="80" height="22" />
<text x="98" y="143">script 2,109</text>
<text x="10" y="176">Bytes 0 to 240 are the</text>
<text class="t-yl" x="10" y="198">same as in DEMO.COM.</text>
</svg>