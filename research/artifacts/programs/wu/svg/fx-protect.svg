<svg class="dg" viewBox="0 0 640 326" role="img" aria-labelledby="fx-protect-t">
<title id="fx-protect-t">How FORM_X unscrambles its hidden credit and fixes its own exit jump: stored bytes, three run-once blocks, the unscrambled text and the patched jump.</title>
<g data-s="1"><text class="t-cy" x="10" y="22">Stored at 0B20 (first 12 of 54 bytes)</text><rect class="box" x="10" y="32" width="41" height="28" /><text x="30.5" y="52" text-anchor="middle">20</text><rect class="box" x="54" y="32" width="41" height="28" /><text x="74.5" y="52" text-anchor="middle">40</text><rect class="box" x="98" y="32" width="41" height="28" /><text x="118.5" y="52" text-anchor="middle">60</text><rect class="box" x="142" y="32" width="41" height="28" /><text x="162.5" y="52" text-anchor="middle">80</text><rect class="box" x="186" y="32" width="41" height="28" /><text x="206.5" y="52" text-anchor="middle">D9</text><rect class="box" x="230" y="32" width="41" height="28" /><text x="250.5" y="52" text-anchor="middle">3B</text><rect class="box" x="274" y="32" width="41" height="28" /><text x="294.5" y="52" text-anchor="middle">AE</text><rect class="box" x="318" y="32" width="41" height="28" /><text x="338.5" y="52" text-anchor="middle">22</text><rect class="box" x="362" y="32" width="41" height="28" /><text x="382.5" y="52" text-anchor="middle">87</text><rect class="box" x="406" y="32" width="41" height="28" /><text x="426.5" y="52" text-anchor="middle">F9</text><rect class="box" x="450" y="32" width="41" height="28" /><text x="470.5" y="52" text-anchor="middle">1A</text><rect class="box" x="494" y="32" width="41" height="28" /><text x="514.5" y="52" text-anchor="middle">5E</text></g>
<g data-s="2"><rect class="box" x="10" y="84" width="196" height="56" /><text x="22" y="106">Block 1, 036E</text><text class="t-cy" x="22" y="128">fixes 5 bytes</text></g>
<g data-s="3"><rect class="box" x="222" y="84" width="196" height="56" /><text x="234" y="106">Block 2, 0A6F</text><text class="t-cy" x="234" y="128">minus previous</text></g>
<g data-s="4"><rect class="box" x="434" y="84" width="196" height="56" /><text x="446" y="106">Block 3, 0B73</text><text class="t-cy" x="446" y="128">sum + A517h</text></g>
<g data-s="3+"><text class="t-cy" x="10" y="164">Unscrambled</text><rect class="box-hi" x="10" y="174" width="41" height="28" /><text class="t-bk" x="30.5" y="194" text-anchor="middle">20</text><text class="t-yl" x="30.5" y="224" text-anchor="middle">_</text><rect class="box-hi" x="54" y="174" width="41" height="28" /><text class="t-bk" x="74.5" y="194" text-anchor="middle">20</text><text class="t-yl" x="74.5" y="224" text-anchor="middle">_</text><rect class="box-hi" x="98" y="174" width="41" height="28" /><text class="t-bk" x="118.5" y="194" text-anchor="middle">20</text><text class="t-yl" x="118.5" y="224" text-anchor="middle">_</text><rect class="box-hi" x="142" y="174" width="41" height="28" /><text class="t-bk" x="162.5" y="194" text-anchor="middle">20</text><text class="t-yl" x="162.5" y="224" text-anchor="middle">_</text><rect class="box-hi" x="186" y="174" width="41" height="28" /><text class="t-bk" x="206.5" y="194" text-anchor="middle">59</text><text class="t-yl" x="206.5" y="224" text-anchor="middle">Y</text><rect class="box-hi" x="230" y="174" width="41" height="28" /><text class="t-bk" x="250.5" y="194" text-anchor="middle">61</text><text class="t-yl" x="250.5" y="224" text-anchor="middle">a</text><rect class="box-hi" x="274" y="174" width="41" height="28" /><text class="t-bk" x="294.5" y="194" text-anchor="middle">73</text><text class="t-yl" x="294.5" y="224" text-anchor="middle">s</text><rect class="box-hi" x="318" y="174" width="41" height="28" /><text class="t-bk" x="338.5" y="194" text-anchor="middle">73</text><text class="t-yl" x="338.5" y="224" text-anchor="middle">s</text><rect class="box-hi" x="362" y="174" width="41" height="28" /><text class="t-bk" x="382.5" y="194" text-anchor="middle">65</text><text class="t-yl" x="382.5" y="224" text-anchor="middle">e</text><rect class="box-hi" x="406" y="174" width="41" height="28" /><text class="t-bk" x="426.5" y="194" text-anchor="middle">72</text><text class="t-yl" x="426.5" y="224" text-anchor="middle">r</text><rect class="box-hi" x="450" y="174" width="41" height="28" /><text class="t-bk" x="470.5" y="194" text-anchor="middle">20</text><text class="t-yl" x="470.5" y="224" text-anchor="middle">_</text><rect class="box-hi" x="494" y="174" width="41" height="28" /><text class="t-bk" x="514.5" y="194" text-anchor="middle">44</text><text class="t-yl" x="514.5" y="224" text-anchor="middle">D</text></g>
<g data-s="4+"><text x="10" y="260">Jump at 0F13:</text><text x="150" y="260">E9 00 00</text><text class="t-yl" x="250" y="260">becomes E9 45 FD</text></g>
<g data-s="5"><text x="10" y="290">Intact: jumps to 0C5B, shows the credit, exits.</text><text class="t-yl" x="10" y="314">One byte changed: E9 46 FE, jumps to 0D5C.</text></g>
</svg>
